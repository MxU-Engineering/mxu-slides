<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MxU Draw">
<title>MxU Slides Draw</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; font: 14px/1.4 system-ui, sans-serif; color: #eee; }
body { touch-action: none; user-select: none; -webkit-user-select: none; }

#login { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #111; z-index: 20; }
#login[hidden] { display: none; }
#login h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
#login input { width: 200px; padding: 12px; font-size: 24px; text-align: center; letter-spacing: .3em; border: 1px solid #444; border-radius: 10px; background: #222; color: #fff; user-select: text; -webkit-user-select: text; }
#login button { width: 200px; padding: 12px; font-size: 16px; border: 0; border-radius: 10px; background: #0a84ff; color: #fff; cursor: pointer; }
#loginErr { color: #ff6b61; min-height: 1.4em; }

#stage { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000; overflow: hidden; }
#stage::after { content: ''; position: absolute; inset: 0; border: 2px solid rgba(255,255,255,.7); outline: 1px solid rgba(0,0,0,.6); outline-offset: -2px; pointer-events: none; z-index: 5; }
#video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: fill; background: #000; }
#ink { position: absolute; inset: 0; transition: opacity .25s; }
#ink.hidden { opacity: 0; }
#ink canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

#banner { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.8); padding: 6px 14px; border-radius: 16px; z-index: 15; }
#banner[hidden] { display: none; }

#bar { position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 6px;
  max-width: calc(100vw - 16px); overflow-x: auto; padding: 6px 8px; background: rgba(24,24,28,.92); border-radius: 26px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
#bar[hidden] { display: none; }
#bar button { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; padding: 0; background: #3a3a42; color: #fff; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#bar button.active { outline: 2px solid #0a84ff; }
#bar i { display: block; width: 18px; height: 18px; border-radius: 50%; }
#bar input[type=color] { flex: none; width: 38px; height: 38px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
#bar input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
#bar input[type=color]::-webkit-color-swatch { border: 2px solid #666; border-radius: 50%; }
#bar input[type=range] { flex: none; width: 80px; }
#bar .sep { flex: none; width: 1px; height: 24px; background: #555; margin: 0 2px; }
#toggleBar { position: fixed; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 11; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(40,40,40,.7); color: #fff; font-size: 18px; opacity: .6; }
</style>
</head>
<body>
<div id="login">
  <h1>MxU Slides Draw</h1>
  <input id="pin" type="text" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN">
  <button id="go">Connect</button>
  <div id="loginErr"></div>
</div>

<div id="stage" hidden>
  <img id="video" alt="">
  <div id="ink"><canvas id="committed"></canvas><canvas id="live"></canvas></div>
</div>
<div id="banner" hidden></div>
<div id="bar" hidden></div>
<button id="toggleBar" title="Tools" hidden>✎</button>

<script>
'use strict';
const $ = id => document.getElementById(id);
const PENS = [
  { name: 'Red marker',  color: '#ff3b30', width: 6,  alpha: 1,   cap: 'round' },
  { name: 'Highlighter', color: '#ffe600', width: 30, alpha: 0.4, cap: 'butt' },
  { name: 'White chalk', color: '#ffffff', width: 5,  alpha: 0.95, cap: 'round' },
  { name: 'Neon cyan',   color: '#00e5ff', width: 5,  alpha: 1,   cap: 'round', glow: 18 },
  { name: 'Green pen',   color: '#34c759', width: 4,  alpha: 1,   cap: 'round' },
  { name: 'Blue brush',  color: '#0a84ff', width: 16, alpha: 0.9, cap: 'round' },
  { name: 'Black pen',   color: '#000000', width: 5,  alpha: 1,   cap: 'round' },
  { name: 'Custom',      color: '#ff00ff', width: 5,  alpha: 1,   cap: 'round', custom: true },
  { name: 'Eraser',      color: '#9a9a9a', width: 30, alpha: 1,   cap: 'round', eraser: true },
];
const store = {
  get(k, d) { try { const v = localStorage.getItem('mxudraw.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sdr.' + k, JSON.stringify(v)); } catch {} },
};

// ---------- state ----------
let ws = null, myId = null, pin = '', authedOnce = false, retry = null, strokeSeq = 0;
let view = { w: 16, h: 9 };
let reg = { x: 0, y: 0, w: 1, h: 1 }; // drawable region, as a fraction of the program output
let strokes = [], hidden = false, dpr = 1;
const active = new Map();
let penIndex = store.get('pen', 0), sizeMul = store.get('size', 1);
const CUSTOM = PENS.findIndex(p => p.custom);
PENS[CUSTOM].color = store.get('customColor', PENS[CUSTOM].color);

const stage = $('stage'), video = $('video');
const committed = $('committed'), live = $('live');
const cctx = committed.getContext('2d'), lctx = live.getContext('2d');

const send = m => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };

// ---------- drawing (strokes are normalized 0..1 of the host window) ----------
function drawStroke(ctx, s, preview) {
  const W = ctx.canvas.width, H = ctx.canvas.height, p = s.p, n = p.length / 2;
  ctx.save();
  ctx.lineCap = s.cap; ctx.lineJoin = 'round';
  ctx.strokeStyle = ctx.fillStyle = s.c;
  const SW = W / reg.w;
  ctx.globalAlpha = s.a; ctx.lineWidth = s.w * SW;
  if (s.e) {
    if (preview) { ctx.strokeStyle = ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.35; }
    else ctx.globalCompositeOperation = 'destination-out';
  }
  if (s.g) { ctx.shadowColor = s.c; ctx.shadowBlur = s.g * SW; }
  const X = i => (p[2 * i] - reg.x) / reg.w * W, Y = i => (p[2 * i + 1] - reg.y) / reg.h * H;
  if (n === 1) {
    ctx.beginPath(); ctx.arc(X(0), Y(0), s.w * SW / 2, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(X(0), Y(0));
    for (let i = 1; i < n - 1; i++) ctx.quadraticCurveTo(X(i), Y(i), (X(i) + X(i + 1)) / 2, (Y(i) + Y(i + 1)) / 2);
    ctx.lineTo(X(n - 1), Y(n - 1));
    ctx.stroke();
  }
  ctx.restore();
}

function eraseSegment(s, a, b) { // a, b: [x, y] in program-output coordinates
  const W = cctx.canvas.width, H = cctx.canvas.height, SW = W / reg.w;
  const px = v => (v - reg.x) / reg.w * W, py = v => (v - reg.y) / reg.h * H;
  cctx.save();
  cctx.globalCompositeOperation = 'destination-out';
  cctx.lineCap = cctx.lineJoin = 'round';
  cctx.lineWidth = s.w * SW; cctx.fillStyle = cctx.strokeStyle = '#000';
  cctx.beginPath();
  if (b) { cctx.moveTo(px(a[0]), py(a[1])); cctx.lineTo(px(b[0]), py(b[1])); cctx.stroke(); }
  else { cctx.arc(px(a[0]), py(a[1]), s.w * SW / 2, 0, Math.PI * 2); cctx.fill(); }
  cctx.restore();
}

function redraw() {
  cctx.clearRect(0, 0, committed.width, committed.height);
  for (const s of strokes) drawStroke(cctx, s);
  scheduleLive();
}

let rafPending = false;
function scheduleLive() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    lctx.clearRect(0, 0, live.width, live.height);
    for (const s of active.values()) if (!s.e) drawStroke(lctx, s);
  });
}

function strokeStart(m) {
  const s = { id: m.id, c: m.c, w: m.w, a: m.a, cap: m.cap, g: m.g || 0, e: m.e ? 1 : 0, p: [...m.p] };
  active.set(s.id, s);
  if (s.e) eraseSegment(s, [s.p[0], s.p[1]]);
  scheduleLive();
}
function strokePoints(m) {
  const s = active.get(m.id);
  if (!s) return;
  for (let i = 0; i < m.p.length; i += 2) {
    if (s.e) eraseSegment(s, [s.p[s.p.length - 2], s.p[s.p.length - 1]], [m.p[i], m.p[i + 1]]);
    s.p.push(m.p[i], m.p[i + 1]);
  }
  if (!s.e) scheduleLive();
}
function strokeEnd(id) {
  const s = active.get(id);
  if (!s) return;
  active.delete(id);
  strokes.push(s);
  if (!s.e) drawStroke(cctx, s);
  scheduleLive();
}

// ---------- layout ----------
function layout() {
  const r = (view.w * reg.w) / (view.h * reg.h);
  let w = innerWidth, h = w / r;
  if (h > innerHeight) { h = innerHeight; w = h * r; }
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  dpr = window.devicePixelRatio || 1;
  for (const c of [committed, live]) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
  Object.assign(video.style, { width: 100 / reg.w + '%', height: 100 / reg.h + '%', left: -reg.x / reg.w * 100 + '%', top: -reg.y / reg.h * 100 + '%' });
  redraw();
}
addEventListener('resize', layout);

function setHidden(h) { hidden = h; $('ink').classList.toggle('hidden', h); }

// ---------- input ----------
function pt(e) {
  const r = stage.getBoundingClientRect();
  const c = v => Math.min(1, Math.max(0, Math.round(v * 1e4) / 1e4));
  return [c(reg.x + (e.clientX - r.left) / r.width * reg.w), c(reg.y + (e.clientY - r.top) / r.height * reg.h)];
}

const pointers = new Map(); // pointerId -> stroke id
let penOnly = store.get('penOnly', false), penDown = 0;
stage.addEventListener('pointerdown', e => {
  if (e.button > 0 && e.pointerType === 'mouse') return;
  if (e.pointerType === 'pen' && !penOnly) { penOnly = true; store.set('penOnly', true); syncPenBtn(); } // first Pencil touch turns on palm rejection
  if (e.pointerType === 'touch' && (penOnly || penDown)) return;
  if (e.pointerType === 'pen') penDown++;
  const pen = PENS[penIndex];
  const m = {
    t: 'ss', id: myId + '.' + (++strokeSeq), c: pen.color, w: Math.round(pen.width * sizeMul / view.w * 1e4) / 1e4, a: pen.alpha,
    cap: pen.cap, g: pen.glow ? Math.round(pen.glow / view.w * 1e4) / 1e4 : 0, e: pen.eraser ? 1 : 0, p: pt(e),
  };
  if (hidden) setHidden(false);
  strokeStart(m);
  send(m);
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, m.id);
});
stage.addEventListener('pointermove', e => {
  const id = pointers.get(e.pointerId);
  if (!id) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  const p = [];
  for (const ev of (evs.length ? evs : [e])) p.push(...pt(ev));
  const m = { t: 'sp', id, p };
  strokePoints(m);
  send(m);
});
function up(e) {
  const id = pointers.get(e.pointerId);
  if (!id) return;
  pointers.delete(e.pointerId);
  if (e.pointerType === 'pen') penDown = Math.max(0, penDown - 1);
  strokeEnd(id);
  send({ t: 'se', id });
}
stage.addEventListener('pointerup', up);
stage.addEventListener('pointercancel', up);
stage.addEventListener('contextmenu', e => e.preventDefault());

// ---------- toolbar ----------
const ERASER_SVG = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M16.2 3.8a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8L10 18H5.5L3.8 16.3a2 2 0 0 1 0-2.8z"/><path d="M8.5 7.5l8 8M10 18h10"/></svg>';
const bar = $('bar');
const cmdBtn = (label, title, fn) => { const b = document.createElement('button'); b.textContent = label; b.title = title; b.onclick = fn; return b; };
const picker = document.createElement('input');
picker.type = 'color'; picker.title = 'Custom color';
picker.oninput = e => { PENS[CUSTOM].color = e.target.value; store.set('customColor', e.target.value); setPen(CUSTOM); };
const size = document.createElement('input');
size.type = 'range'; size.min = 0.5; size.max = 3; size.step = 0.1; size.value = sizeMul; size.title = 'Size';
size.oninput = e => { sizeMul = +e.target.value; store.set('size', sizeMul); };

function setPen(i) {
  penIndex = i; store.set('pen', i);
  [...bar.querySelectorAll('[data-pen]')].forEach(b => b.classList.toggle('active', +b.dataset.pen === i));
  if (i === CUSTOM) picker.value = PENS[CUSTOM].color;
  const dot = bar.querySelector(`[data-pen="${CUSTOM}"] i`);
  if (dot) dot.style.background = PENS[CUSTOM].color;
}

let penBtn = null;
function syncPenBtn() { if (penBtn) { penBtn.classList.toggle('active', penOnly); penBtn.title = penOnly ? 'Pencil only (palm rejection on) — tap to allow finger' : 'Allow finger and Pencil — tap for Pencil only'; } }

function buildBar() {
  bar.replaceChildren();
  PENS.forEach((p, i) => {
    const b = document.createElement('button');
    b.dataset.pen = i; b.title = p.name;
    if (p.eraser) b.innerHTML = ERASER_SVG;
    else { const d = document.createElement('i'); d.style.background = p.color; d.style.opacity = Math.max(p.alpha, 0.6); if (p.glow) d.style.boxShadow = `0 0 8px ${p.color}`; b.append(d); }
    b.onclick = () => setPen(i);
    bar.append(b);
  });
  picker.value = PENS[CUSTOM].color;
  const sep = () => Object.assign(document.createElement('span'), { className: 'sep' });
  bar.append(picker, size, sep(),
    cmdBtn('↶', 'Undo', () => send({ t: 'cmd', c: 'undo' })),
    cmdBtn('🗑', 'Clear', () => send({ t: 'cmd', c: 'clear' })),
    cmdBtn('👁', 'Hide / show drawing', () => send({ t: 'cmd', c: hidden ? 'show' : 'hide' })),
    (penBtn = cmdBtn('✋', '', () => { penOnly = !penOnly; store.set('penOnly', penOnly); syncPenBtn(); })),
    cmdBtn('⛶', 'Fullscreen', () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }),
    cmdBtn('✕', 'Hide toolbar', () => showBar(false)));
  setPen(penIndex); syncPenBtn();
}
function showBar(v) { bar.hidden = !v; $('toggleBar').hidden = v; }
$('toggleBar').onclick = () => showBar(true);

// ---------- program preview (JPEG frames pushed by the host) ----------
let frameUrl = null;
function showFrame(blob) {
  const next = URL.createObjectURL(blob);
  video.onload = () => { if (frameUrl && frameUrl !== next) URL.revokeObjectURL(frameUrl); frameUrl = next; };
  video.src = next;
}

// ---------- connection ----------
function banner(msg) { $('banner').hidden = !msg; $('banner').textContent = msg || ''; }

function setRegion(r) {
  const ok = r && r.w > 0 && r.h > 0;
  reg = ok ? { x: r.x, y: r.y, w: r.w, h: r.h } : { x: 0, y: 0, w: 1, h: 1 };
}

function onState(m) {
  view = m.view; setRegion(m.region);
  strokes = []; active.clear();
  for (const s of m.strokes) {
    const o = { id: s.id, c: s.c, w: s.w, a: s.a, cap: s.cap, g: s.g || 0, e: s.e, p: s.p };
    if (s.open) active.set(s.id, o); else strokes.push(o);
  }
  setHidden(m.hidden); layout();
}

function onMessage(m) {
  switch (m.t) {
    case 'auth':
      if (!m.ok) { authedOnce = false; $('loginErr').textContent = m.error || 'Login failed'; store.set('pin', ''); return; }
      authedOnce = true; myId = m.id; store.set('pin', pin);
      $('login').hidden = true; stage.hidden = false;
      if (!bar.children.length) { buildBar(); showBar(true); }
      banner(m.host ? '' : 'Waiting for the host…');
      layout();
      break;
    case 'host':
      banner(m.online ? '' : 'Host offline…');
      break;
    case 'state': onState(m); break;
    case 'view': view = { w: m.w, h: m.h }; layout(); break;
    case 'region': setRegion(m); layout(); break;
    case 'hidden': setHidden(m.v); break;
    case 'ss': strokeStart(m); break;
    case 'sp': strokePoints(m); break;
    case 'se': strokeEnd(m.id); break;
    case 'clear': strokes = []; active.clear(); redraw(); lctx.clearRect(0, 0, live.width, live.height); break;
    case 'undo': { const i = strokes.findIndex(s => s.id === m.id); if (i >= 0) { strokes.splice(i, 1); redraw(); } break; }
  }
}

function connect() {
  clearTimeout(retry);
  if (ws) { const old = ws; ws = null; old.close(); }
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.binaryType = 'blob';
  const mine = ws;
  ws.onopen = () => send({ t: 'login', pin });
  ws.onmessage = e => { if (ws !== mine) return; if (typeof e.data !== 'string') { showFrame(new Blob([e.data], { type: 'image/jpeg' })); return; } try { onMessage(JSON.parse(e.data)); } catch {} };
  ws.onclose = () => {
    if (ws !== mine) return;
    if (authedOnce) { banner('Connection lost — reconnecting…'); retry = setTimeout(connect, 1500); }
    else if (!$('loginErr').textContent) $('loginErr').textContent = 'Could not connect';
    $('go').disabled = false;
  };
}

function login() {
  pin = $('pin').value.trim();
  if (!pin) return;
  $('loginErr').textContent = '';
  authedOnce = false;
  connect();
}
$('go').onclick = login;
$('pin').onkeydown = e => { if (e.key === 'Enter') login(); };
const saved = store.get('pin', '');
if (saved) { $('pin').value = saved; login(); }
</script>
</body>
</html>
